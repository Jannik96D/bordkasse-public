name: CodeQL

# Statische Security-Analyse für JS/TS. Für öffentliche Repos kostenlos
# (GitHub Advanced Security). Ergebnisse landen im "Security"-Tab des Repos.
# Läuft ohne Path-Filter → meldet immer; kann daher gefahrlos als zusätzlicher
# Required-Check für `main` gesetzt werden (kein "stuck pending").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # wöchentlich, montags 03:27 UTC

# Workflow-Standard: nur lesen; der Job hebt gezielt security-events an.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyse (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: CodeQL-Analyse
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:javascript-typescript"
