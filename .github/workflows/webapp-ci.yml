name: webapp-ci

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (S1–S7)
        run: pnpm test

# Hinweis: `supabase db lint` (search_path-Pins auf SECURITY-DEFINER-Funktionen
# etc.) wird bewusst NICHT in CI ausgeführt — `supabase start` läuft im
# GitHub-Runner nicht zuverlässig (Docker/Image-Setup) und produzierte nur ein
# rotes, nicht-aussagekräftiges Kreuz. Stattdessen lokal vor größeren
# Schema-Änderungen ausführen:
#   supabase start && supabase db lint --level warning && supabase stop
