name: webapp-ci

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (S1–S7)
        run: pnpm test

  # pgTAP-Tests gegen die echten SQL-Views/Funktionen. Zusammen mit den
  # Vitest-Tests (TS-Mirror in lib/calc/*) bilden sie den Drift-Guard: ändert
  # sich eine View, ohne dass der TS-Mirror nachgezogen wird (Bug-Klasse 0031/
  # 0032), schlägt einer der beiden Läufe an.
  #
  # Historie: Früher lief das nicht in CI, weil das volle `supabase start` im
  # GitHub-Runner unzuverlässig war. Lösung: nur die DB-relevanten Container
  # starten (-x schließt die schweren UI-/Analytics-/Edge-Services aus), das
  # ist deutlich schlanker und stabiler. Eigener Job, damit ein Infra-Flake den
  # schnellen lint-test-Job nicht blockiert.
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Das Legacy-seed.sql referenziert persons.email (vor Migration 0013) und
      # bricht sonst `supabase start`. Die pgTAP-Tests erzeugen ihre eigenen
      # Fixtures (BEGIN/ROLLBACK) — Seed-Daten sind hier unnötig, daher leeren.
      - name: Legacy-Seed für CI leeren
        run: ': > supabase/seed.sql'

      - name: Start Supabase (DB-only)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,inbucket

      # Direkt über die Supabase-CLI (kein pnpm/Node im DB-Job nötig).
      - name: pgTAP (SQL-Views/Funktionen)
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop
