name: webapp-ci

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (S1–S7)
        run: pnpm test

  db-lint:
    # Lintet das Datenbank-Schema (u. a. fehlende search_path-Pins auf
    # SECURITY-DEFINER-Funktionen, RLS-Lücken). Aktuell berichtend:
    # continue-on-error hält die CI grün, solange noch offene Hinweise
    # bestehen. Sobald aufgeräumt, `--level warning` zu `--fail-on warning`
    # hochstufen und continue-on-error entfernen, dann ist es ein echtes Gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase starten (wendet Migrationen an)
        run: supabase start

      - name: Datenbank-Schema linten
        run: supabase db lint --level warning

      - name: Supabase stoppen
        if: always()
        run: supabase stop
