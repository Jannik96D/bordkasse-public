name: Secret Scan

# Sucht nach versehentlich eingecheckten Secrets (API-Keys, Tokens, Passwörter,
# Private Keys, JWTs) — in der gesamten Git-Historie, nicht nur im Diff.
#
# Ergänzt GitHubs eigenes Secret Scanning + Push Protection (Repo-Einstellung,
# erkennt Provider-Muster): gitleaks findet zusätzlich generische Muster wie
# SMTP-Passwörter, Supabase-Service-Role-JWTs oder VAPID-Keys.
#
# Läuft ohne Path-Filter → meldet immer; kann daher gefahrlos als Required-Check
# für `main` gesetzt werden (kein "stuck pending", siehe webapp-ci.yml).
#
# gitleaks wird als gepinntes Release-Binary mit fester SHA-256 geladen statt
# über eine Drittanbieter-Action: kein Lizenz-Key, keine nachladende Fremd-Version.
# Update: Version + Prüfsumme gemeinsam anheben (Prüfsumme steht in
# gitleaks_<version>_checksums.txt im jeweiligen Release).
# Konfiguration + Ausnahmen: .gitleaks.toml im Repo-Root.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # wöchentlich, montags 04:41 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle Historie — ein Secret, das später "nur" gelöscht wurde,
          # bleibt in der Historie auslesbar.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren (gepinnt, Prüfsumme verifiziert)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Secrets suchen (gesamte Historie)
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
