# Dependabot — automatische Versions-Updates (gratis für alle Repos).
# Achtung: Dependabot-SECURITY-ALERTS sind ein separater Schalter unter
# Settings → Code security → "Dependabot alerts"/"security updates" — die
# hier definierten "version updates" sind unabhängig davon.
version: 2
updates:
  # npm-Dependencies der Web-App (webapp/)
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # @types/node bleibt an die Node-Runtime gekoppelt (CI + Container-Image
      # `node:22-alpine` = Node 22). Major-Bumps (23+) bringen Typen für APIs,
      # die auf Node 22 zur Laufzeit nicht existieren → Typecheck grün, aber
      # Crash im Container. Deshalb wurden
      # #172 (→25) und #201 (→26) geschlossen. Minor/Patch (22.x) bleiben erlaubt.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # Minor-/Patch-Updates gebündelt → ein Sammel-PR statt vieler einzelner.
      # Major-Updates (z. B. Next 16→17) kommen weiterhin einzeln zur Review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Versionen der GitHub-Actions (actions/checkout, setup-node, supabase/setup-cli,
  # codeql-action, dependency-review-action, …) — scannt .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
