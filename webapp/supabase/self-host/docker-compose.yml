# ── Bordkasse: selbst gehosteter Supabase-Stack (Slim) ───────────────────
#
# Abgeleitet vom offiziellen supabase/docker/docker-compose.yml. Bewusst
# NICHT enthalten, weil die App diese Dienste nachweislich nicht nutzt:
#
#   storage + imgproxy  → keine einzige Storage-Nutzung im Code
#   functions           → keine Edge Functions im Projekt
#   supavisor (Pooler)  → eine App als einziger Client, kein Pooling nötig
#   analytics + vector  → Logs liest der Skipper in Coolify
#
# Ersparnis gegenüber dem vollen Stack: ~1–1,5 GB RAM.
#
# ACHTUNG — Erreichbarkeit von außen ist NICHT Teil dieser Datei.
# Absichtlich sind unten KEINE Host-Ports veröffentlicht. Welche Domain auf
# welchen Container zeigt, entscheidet und konfiguriert ausschließlich der
# Server-Betreiber am Reverse-Proxy. Was gebraucht wird:
#
#   kong  Port 8000  → die Supabase-Domain (z. B. sb.bordkasse.dieter.ms)
#                      Liefert /rest/v1, /auth/v1, /realtime/v1 UND Studio
#                      unter / (hinter Basic-Auth, siehe DASHBOARD_*).
#
# Mehr braucht von außen nichts erreichbar zu sein — Postgres, GoTrue,
# PostgREST, Realtime und Meta reden nur über das Docker-Netz. Postgres
# absichtlich NICHT veröffentlichen: Migrationen und Dumps laufen über
# `docker compose exec db …` (siehe docs/self-hosting.md).
#
# Versionen sind bewusst gepinnt. Updates laufen über diese Datei im Repo,
# nicht über ein Template, das sich unter uns ändert.
#
# ⚠️ COOLIFY: „Preserve Repository During Deployment" MUSS aktiv sein.
#
# Diese Datei bindet Nachbardateien per relativem Bind-Mount ein (kong.yml,
# kong-entrypoint.sh, volumes/db/*.sql). Ohne die Option führt Coolify
# `docker compose up` in einem WEGWERF-Build-Container aus; das Repo liegt
# dann nicht auf dem Host, wo der Docker-Daemon die Bind-Mounts auflöst.
# Docker legt daraufhin leere VERZEICHNISSE an den Quellpfaden an, und ein
# Verzeichnis auf einen Datei-Pfad zu mounten scheitert → der Deploy bricht
# nach ~1 Minute ab (kein Healthcheck-Timeout, sondern sofort).
#
# Setzen (die Coolify-UI kann es auch, das General-Formular hat aber in
# v4.2.0 einen Speicher-Bug — siehe docs/self-hosting.md):
#   curl -X PATCH "$COOLIFY/api/v1/applications/$APP_UUID" \
#     -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
#     -d '{"is_preserve_repository_enabled":true}'

name: bordkasse-supabase

services:
  # ── Datenbank ─────────────────────────────────────────────────────────
  db:
    container_name: bordkasse-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # Muss Superuser sein (Event-Trigger)
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      # Muss Superuser sein (reservierte Rollen ändern)
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # PGDATA — der eigentliche Datenbestand.
      #
      # ⚠️ ABSICHTLICH ein Named Volume, KEIN Bind-Mount auf
      # ./volumes/db/data. Der Pfad läge sonst im Git-Checkout, das Coolify
      # verwaltet: ein Redeploy mit frischem Clone oder `git clean -xfd`
      # (je nach Deploy-Modus / „Force rebuild") würde das per .gitignore
      # ausgeschlossene Verzeichnis mitnehmen — Postgres initialisiert dann
      # eine LEERE Datenbank und die App sieht aus wie gelöscht. Ein Named
      # Volume liegt außerhalb des Checkouts und übersteht Redeploys.
      - db-data:/var/lib/postgresql/data
      # Named Volume, damit der pgsodium-Key Neustarts überlebt
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      # ⚠️ POSTGRES_USER hier NIEMALS setzen.
      #
      # Das Image bringt `POSTGRES_USER=supabase_admin` mit, und `initdb`
      # erzeugt daraus den Superuser. Genau als DIESE Rolle verbindet sich
      # anschließend das Init-Skript des Images
      # (/docker-entrypoint-initdb.d/migrate.sh), das alle Supabase-Rollen
      # (authenticator, supabase_auth_admin, anon, authenticated,
      # service_role, …) und Schemata anlegt.
      #
      # Ein Override auf `postgres` benennt den Superuser um, migrate.sh
      # bricht mit `role "supabase_admin" does not exist` ab — und weil das
      # NUR beim ersten Start passiert, bleibt die Datenbank dauerhaft ohne
      # Rollen. Sichtbare Folge: realtime/rest/auth in einer Neustart-
      # Schleife, während db selbst „healthy" meldet. Upstream setzt die
      # Variable bewusst nicht (nur `POSTGRES_USER_READ_WRITE` bei studio).
      # `volumes/db/realtime.sql` liest $POSTGRES_USER — der Wert kommt
      # bereits aus dem Image, die Variable ist also nie leer.
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        # Verhindert, dass die Realtime-Polling-Queries die Logs zumüllen
        "-c",
        "log_min_messages=fatal",
      ]

  # ── Auth (Magic-Link) ─────────────────────────────────────────────────
  auth:
    container_name: bordkasse-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      # SITE_URL ist der Origin der App — die Magic-Link-Mail baut daraus
      # {{ .SiteURL }}/auth/confirm?token_hash=…
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # Wie Upstream: mit /auth/v1-Suffix. Ein abweichender `iss` in den
      # User-Tokens ist heute für App und PostgREST folgenlos, würde aber bei
      # einer künftigen GoTrue-Version mit strikter iss-Prüfung teuer.
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"

      # MUSS "true" sein — das ist das Gegenstück zu „Confirm email = OFF"
      # im Cloud-Dashboard (siehe README, Abschnitt „Auth konfigurieren").
      #
      # Es überspringt NICHT den Magic-Link-Klick, sondern nur die separate
      # „Confirm signup"-Mail. Bei "false" bekäme jedes NEU eingeladene
      # Crewmitglied statt des Magic-Links eine Signup-Bestätigung: englisches
      # Default-Template (wir setzen kein CONFIRMATION-Template), und deren
      # {{ .ConfirmationURL }} zeigt auf den PKCE-Endpunkt statt auf unsere
      # /auth/confirm-Route mit token_hash — der Login bräche also genau für
      # Erst-Einladungen, während bestehende Crew nichts merkt.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

      # Gültigkeit des Magic-Links: 60 Minuten (wie bisher in der Cloud)
      GOTRUE_MAILER_OTP_EXP: 3600

      # ── Rate-Limits ──────────────────────────────────────────────────
      # Der Login-Screen bietet „Neuen Link senden" nach 30 s an. GoTrues
      # Default für SMTP_MAX_FREQUENCY ist 1 Minute — der zweite Klick liefe
      # sonst in ein 429 („you can only request this after…").
      GOTRUE_SMTP_MAX_FREQUENCY: 20s
      # Default sind 30 Mails/Stunde. Eine 12-köpfige Crew anlegen und dabei
      # ein paar Adressen korrigieren reißt das — dann scheitern Einladungen,
      # während die Crew-Anlage nur eine weiche Warnung zeigt.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100

      # ── SMTP (eigener Mailserver, wie die App-Mails) ─────────────────
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

      # ── Gebrandetes Template ─────────────────────────────────────────
      # WICHTIG: Self-hosted GoTrue liest Templates NUR per HTTP-URL, nicht
      # aus gemounteten Dateien. Die App liefert das Template aus ihrem
      # public/-Ordner aus; GoTrue holt es über das Docker-Netz.
      # Ist die URL nicht erreichbar, fällt GoTrue STILL auf sein
      # Default-Template zurück — dann kommen unbrandete Mails an, ohne
      # jeden Fehler im Log. Nach Änderungen also immer eine Testmail.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${MAILER_TEMPLATE_MAGIC_LINK}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: ${MAILER_SUBJECT_MAGIC_LINK}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}

  # ── PostgREST (alle Lese-Queries der App) ─────────────────────────────
  rest:
    container_name: bordkasse-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Muss zu supabase/config.toml passen (api.schemas / extra_search_path),
      # sonst antwortet PostgREST auf bekannte Tabellen mit 404.
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # ── Realtime (components/realtime-trip.tsx) ───────────────────────────
  realtime:
    # Der Container-Name sieht falsch aus, ist aber korrekt: Realtime leitet
    # seine Tenant-ID aus dem Namen ab (Upstream-Kommentar).
    #
    # NICHT auf `bordkasse-…` umbenennen, obwohl es zu den anderen Containern
    # passen würde: kong.yml referenziert diesen Namen als Upstream-Host an
    # vier Stellen. Eine Umbenennung nur hier lässt jede Realtime-Anfrage in
    # einem 502 enden — die App rendert normal weiter, nur Live-Updates
    # bleiben still aus. Deshalb bewusst identisch zu Upstream.
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health",
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  # ── Postgres-Meta (Backend für Studio) ────────────────────────────────
  meta:
    container_name: bordkasse-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # ── Studio (Web-UI auf die DB) ────────────────────────────────────────
  studio:
    container_name: bordkasse-studio
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\"",
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      # Logflare läuft bei uns nicht — Logs kommen aus Coolify.
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./volumes/snippets:/app/snippets:z

  # ── Kong: interner API-Gateway ────────────────────────────────────────
  # Bündelt /rest/v1, /auth/v1, /realtime/v1 und /pg unter EINER URL, weil
  # supabase-js genau dieses Pfad-Layout erwartet. Liefert zusätzlich Studio
  # unter / hinter Basic-Auth aus. Das ist Supabases eigener Gateway
  # INNERHALB dieses Stacks — er hat nichts mit dem Reverse-Proxy des
  # Servers zu tun und wird von dieser Datei vollständig beschrieben.
  kong:
    container_name: bordkasse-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    networks:
      default:
        aliases:
          - api-gw
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      # Studio bewusst nur `service_started`, NICHT `service_healthy`: sonst
      # hängt die gesamte API (REST, Auth, Realtime) am Gesundheitszustand
      # des optionalen Dashboards. Ein Studio-Update, dessen Healthcheck
      # nicht mehr greift — oder das unter RAM-Druck in sein start_period
      # läuft — würde Login, Buchungen und Bilanz komplett offline nehmen,
      # obwohl DB, Auth und REST gesund sind.
      studio:
        condition: service_started
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    # Host-Ports absichtlich NICHT veröffentlicht — siehe Kopf der Datei.
    # Der Server-Betreiber entscheidet, wie Port 8000 erreichbar wird.
    expose:
      - "8000"
    volumes:
      - ./kong.yml:/home/kong/temp.yml:ro,z
      - ./kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Supabases „Opaque Keys" nutzen wir nicht — aber LEER DEKLARIEREN ist
      # Pflicht. kong-entrypoint.sh substituiert nur Variablen, die in ENVIRON
      # stehen; undefinierte bleiben wörtlich in der Config stehen und wären
      # dann selbst ein gültiger API-Key (siehe Warnblock in kong.yml). Leer
      # gesetzt greift die sed-Zeile, die leere Keys entfernt.
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      # Studio-Login (Basic-Auth). Das ist der einzige Schutz vor dem
      # vollen DB-Zugriff an RLS vorbei — langes, einmaliges Passwort.
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

volumes:
  # Der Datenbestand. Überlebt `docker compose down` und Redeploys; ein
  # `docker compose down -v` löscht ihn — dieses Flag niemals blind nutzen.
  db-data:
  db-config:
