<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#114884" />
    <title>Offline · Bordkasse</title>
    <style>
      /* Bewusst self-contained (Inline-Styles): Diese Seite muss auch dann
         laden, wenn KEINE App-CSS im Cache liegt. Farben = Design-Tokens. */
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom)) 1.5rem;
        text-align: center;
        background: #FAFBFC;
        color: #1A1F2A;
        font-family: Arial, "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img { width: 8rem; height: auto; }
      h1 { margin: 0; font-size: 1.5rem; color: #114884; }
      p { margin: 0; max-width: 22rem; font-size: 0.95rem; line-height: 1.5; color: #4A5468; }
      .hint {
        max-width: 22rem;
        border: 1px solid rgba(17, 72, 132, 0.2);
        background: rgba(253, 246, 220, 0.5);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
        color: #4A5468;
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: none;
        border-radius: 0.375rem;
        background: #114884;
        color: #FAFBFC;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1D4281; }
      button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(17, 72, 132, 0.4); }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="Bordkasse" />
    <h1>Du bist offline</h1>
    <p>
      Diese Seite ist noch nicht für die Offline-Nutzung gespeichert. Sobald du
      wieder Empfang hast, geht es weiter.
    </p>
    <p class="hint">
      Keine Sorge: Buchungen, die du offline erfasst hast, sind lokal gesichert
      und werden automatisch übertragen, sobald du wieder online bist.
    </p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
    <script>
      // Automatisch zurückspringen, sobald die Verbindung wieder da ist.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
